<svg version="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
    <defs>
        <style type="text/css"><![CDATA[
      @keyframes colorChange
	    {
	      0%   {fill: #87D5F7; transform:rotate(0.02deg);}
	      20%  {fill: #67CCF2; transform:rotate(0deg);}
	      40%  {fill: #00B4EF; transform:rotate(0.02deg);}
	      60%  {fill: #0098D8; transform:rotate(0deg);}
	      80% {fill:  #005B88; transform:rotate(0.02deg);}
	      100% {fill: #003660; transform:rotate(0deg);}
	    }

	    @-webkit-keyframes colorChange
	    {
	      0%   {fill: #87D5F7; transform:rotate(0.02deg);}
	      20%  {fill: #67CCF2; transform:rotate(0deg);}
	      40%  {fill: #00B4EF; transform:rotate(0.02deg);}
	      60%  {fill: #0098D8; transform:rotate(0deg);}
	      80% {fill:  #005B88; transform:rotate(0.02deg);}
	      100% {fill: #003660; transform:rotate(0deg);}
	    }
	  .magma-progress-logo-shape {
	  	animation-name: colorChange;
	  	animation-iteration-count: infinite;
		fill: #ffffff;
	  }
      .magma-progress-logo-shape-1 {
    	animation-duration: 0.425s;
    	animation-delay: 0.375s;
      }
      .magma-progress-logo-shape-2 {
    	animation-duration: 0.425s;
    	animation-delay: 0.3s;
      }
      .magma-progress-logo-shape-3 {
    	animation-duration: 0.425s;
    	animation-delay: 0.225s;
      }
      .magma-progress-logo-shape-4 {
    	animation-duration: 0.425s;
    	animation-delay: 0.15s;
      }
      .magma-progress-logo-shape-5 {
    	animation-duration: 0.425s;
    	animation-delay: 0.075s;
      }
      .magma-progress-logo-shape-6 {
    	animation-duration: 0.425s;
    	animation-delay: 0s;
      }
    ]]></style>
    </defs>
